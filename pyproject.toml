[project]
name = "fastapi-turorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mohamedalmansoury", email = "mohamedpt911@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.124.4",
    "fastapi-users[sqlalchemy]>=13.0.0",
    "imagekitio>=4.2.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.1",
    "uvicorn[standard]>=0.33.0",
]

[project.scripts]
fastapi-turorial = "fastapi_turorial:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
